name: Publish webserver

on:
  push:
    tags:
      - "webserver-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install compileSdk platform
        run: sdkmanager "platforms;android-37"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#webserver-v}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :webserver:publish -PlibVersion=${{ steps.version.outputs.version }}
